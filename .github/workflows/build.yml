name: Build WoodenFish APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.16.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: 配置国内Pub镜像
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> $GITHUB_ENV

      - name: 安装依赖
        run: flutter pub get

      # ====== 清理旧图标残留文件，解决重复资源冲突 ======
      - name: 清理旧图标资源
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          rm -f android/app/src/main/res/values/ic_launcher_background.xml

      # ======== 生成APP图标 ========
      - name: 生成应用图标
        run: dart run flutter_launcher_icons

      - name: 编译APK，全局注入namespace参数
        run: flutter build apk --release --no-shrink --dart-define=android.namespace=auto

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: woodenfish-apk
          path: build/app/outputs/flutter-apk/app-release.apk
